"$schema" = 'https://starship.rs/config-schema.json'

scan_timeout = 30
add_newline = true

format = """
[░▒▓](#a3aed2)\
$hostname\
$os\
[](bg:#769ff0 fg:#a3aed2)\
$directory\
[](fg:#769ff0 bg:#394260)[$git_branch$git_status](bg:#394260)\
[](fg:#394260 bg:#212736)[$python$rust$golang](bg:#212736)\
[](fg:#212736)\
$fill\
[](fg:#212736)\
[](fg:#212736 bg:#212736)\
[$status](bg:#394260 fg:#394260)\
[](bg:#394260 fg:#769ff0)\
[$battery](fg:#769ff0 bg:#769ff0)\
[](bg:#769ff0 fg:#a3aed2)\
[](bg:#a3aed2 fg:#a3aed2)$time\
[▓▒░](#a3aed2)\
$line_break """

